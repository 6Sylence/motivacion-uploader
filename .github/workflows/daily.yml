name: Daily motivation video

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC ≈ 08:00 España — motivación de la mañana
  workflow_dispatch:
    inputs:
      privacy:
        description: "Privacidad del vídeo"
        type: choice
        default: public
        options: [public, unlisted, private]
      max_seconds:
        description: "Cortar narración (s) — 0 = guion completo"
        default: "0"

concurrency:
  group: daily-upload
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Render & upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CHANNEL_NAME: ${{ secrets.CHANNEL_NAME }}
          VOICE: ${{ secrets.VOICE }}
          AFFILIATE_BLOCK: ${{ secrets.AFFILIATE_BLOCK }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          ELEVEN_VOICE_NAME: ${{ secrets.ELEVEN_VOICE_NAME }}
          ELEVEN_STABILITY: ${{ secrets.ELEVEN_STABILITY }}
          ELEVEN_STYLE: ${{ secrets.ELEVEN_STYLE }}
          ELEVEN_SIMILARITY: ${{ secrets.ELEVEN_SIMILARITY }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          MAX_SECONDS: ${{ github.event.inputs.max_seconds || '0' }}
          SLOT: "0"
        run: python -m src.pipeline

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motivacion-out
          path: |
            out/video.mp4
            out/thumb.jpg
          if-no-files-found: ignore
          retention-days: 7
