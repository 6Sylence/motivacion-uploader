name: Voice samples

# One-off: renders short processed samples of several Spanish voices to pick the
# most motivating one. Uploads them as an artifact. Removed after use.
on:
  workflow_dispatch:
  push:
    branches: [claude/ambient-youtube-automation-r5x2ec]
    paths: [".github/workflows/voice-samples.yml"]

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install edge-tts
        run: pip install "edge-tts>=7.0.0"
      - name: Render voice samples
        run: python scripts/voice_samples.py
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: out/samples/*.mp3
          if-no-files-found: warn
          retention-days: 7
